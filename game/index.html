
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Mafia Killer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }
        
        /* Canvas фиксированного размера */
        canvas {
            display: block;
            width: 1280;
            height: 720px;
        }
        
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.8);
            color: #0ff;
        }
        .hidden { display: none !important; }
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 20px;
            cursor: pointer;
            background: #111;
            color: #0ff;
            border: 1px solid #0ff;
        }
        button:hover { background: #0ff; color: #000; }

        #game-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .video-fallback {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .fallback-text {
            font-size: 48px;
            font-family: monospace;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 0, 100, 0.8);
        }

        .fallback-subtitle {
            font-size: 20px;
            font-family: monospace;
            color: #aaa;
            margin-bottom: 40px;
        }

        .skip-btn {
            padding: 12px 32px;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #fff;
            color: #fff;
            cursor: pointer;
            font-family: monospace;
            transition: all 0.2s;
        }

        .skip-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        /* Контейнер меню — на весь экран, центрирование */
        #menu-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        /* Внутренний контейнер: кнопка | splash | кнопка */
        .menu-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 40px;
        }

        /* Заставка в центре */
        .menu-container .splash {
            max-height: 80vh;   /* Не выше 80% экрана */
            max-width: 50vw;    /* Не шире 50% экрана */
            object-fit: contain;
            user-select: none;
            pointer-events: none; /* Клик проходит сквозь неё */
        }

        /* Круглые кнопки языков */
        .menu-container .lang-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease, filter 0.15s ease;
            object-fit: cover;
        }

        .menu-container .lang-btn:hover {
            transform: scale(1.1);
            filter: brightness(1.2) drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
        }

        .menu-container .lang-btn:active {
            transform: scale(0.95);
        }

        /* Контейнер игры — на весь экран, центрирует canvas */
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;  /* Цвет "_letterbox_" полос */
            overflow: hidden;
        }

        /* Canvas масштабируется через transform, реальный размер не меняется */
        #gameCanvas {
            display: block;
            transform-origin: center center;
            image-rendering: pixelated;  /* Для пиксель-арта — никаких сглаживаний */
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
    </div>
    
    <div id="ui-layer">
        <div id="menu-screen" class="screen">
            <div class="menu-container">
                <img src="assets/start_ru.png" class="lang-btn" data-lang="ru" alt="Русский" onclick="startGame('ru')">
                <img src="assets/splash.jpg" class="splash" alt="Splash">
                <img src="assets/start_en.png" class="lang-btn" data-lang="en" alt="English" onclick="startGame('en')">
            </div>
        </div>
        
        <div id="video-screen" class="screen hidden">
        <video id="game-video" autoplay playsinline></video>
        <div id="video-fallback" class="video-fallback hidden">
            <div class="fallback-text">[VIDEO PLACEHOLDER]</div>
            <div class="fallback-subtitle" id="fallback-subtitle"></div>
            <button id="skip-video-btn" class="skip-btn">Пропустить / Skip</button>
        </div>
    </div>
    </div>

    

    <script src="atlas_data.js"></script>
    <script src="locations.js"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="character.js"></script>
    <script src="player.js"></script>
    <script src="bullet.js"></script>
    <script src="puta.js"></script>
    <script src="diler.js"></script>
    <script src="big_bandit.js"></script>
    <script src="samura.js"></script>
    <script src="police_dron.js"></script>
    <script src="dialog.js"></script>
    <script src="dialogs.js"></script>
    <script src="rikki_rat.js"></script>
    <script src="game.js"></script>
</body>
</html>
