<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Mafia Killer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }
        
        /* Canvas фиксированного размера */
        canvas {
            display: block;
            width: 1280;
            height: 720px;
        }
        
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.8);
            color: #0ff;
        }
        .hidden { display: none !important; }
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 20px;
            cursor: pointer;
            background: #111;
            color: #0ff;
            border: 1px solid #0ff;
        }
        button:hover { background: #0ff; color: #000; }

        #game-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .video-fallback {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .fallback-text {
            font-size: 48px;
            font-family: monospace;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 0, 100, 0.8);
        }

        .fallback-subtitle {
            font-size: 20px;
            font-family: monospace;
            color: #aaa;
            margin-bottom: 40px;
        }

        .skip-btn {
            padding: 12px 32px;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #fff;
            color: #fff;
            cursor: pointer;
            font-family: monospace;
            transition: all 0.2s;
        }

        .skip-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    
    <div id="ui-layer">
        <div id="menu-screen" class="screen">
            <h1>MAFIA KILLER</h1>
            <button onclick="startGame('ru')">Русский</button>
            <button onclick="startGame('en')">English</button>
        </div>
        
        <div id="video-screen" class="screen hidden">
        <video id="game-video" autoplay playsinline></video>
        <div id="video-fallback" class="video-fallback hidden">
            <div class="fallback-text">[VIDEO PLACEHOLDER]</div>
            <div class="fallback-subtitle" id="fallback-subtitle"></div>
            <button id="skip-video-btn" class="skip-btn">Пропустить / Skip</button>
        </div>
    </div>
    </div>

    

    <script src="atlas_data.js"></script>
    <script src="locations.js"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="character.js"></script>
    <script src="player.js"></script>
    <script src="bullet.js"></script>
    <script src="puta.js"></script>
    <script src="diler.js"></script>
    <script src="big_bandit.js"></script>
    <script src="samura.js"></script>
    <script src="police_dron.js"></script>
    <script src="dialog.js"></script>
    <script src="dialogs.js"></script>
    <script src="rikki_rat.js"></script>
    <script src="game.js"></script>
</body>
</html>
